<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | PsychoVerse</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#050505;
    color:white;
    font-family:Arial, Helvetica, sans-serif;

}


/* NAVBAR */

nav{

    height:90px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 7%;
    border-bottom:1px solid #222;

}


.logo{

    font-size:25px;
    font-weight:800;
    letter-spacing:5px;

}


nav ul{

    display:flex;
    gap:40px;
    list-style:none;

}


nav a{

    color:#aaa;
    text-decoration:none;
    font-size:15px;
    letter-spacing:1px;
    transition:.3s;

}


nav a:hover{

    color:white;

}



/* CONTACT */

.contact{

    min-height:calc(100vh - 90px);
    padding:80px 12%;

}


.contact h1{

    text-align:center;
    font-size:55px;
    margin-bottom:30px;

}


.contact p{

    text-align:center;
    color:#aaa;
    font-size:20px;
    margin-bottom:40px;

}



form{

    max-width:800px;
    margin:auto;

}


input,
textarea{

    width:100%;
    background:#222;
    border:none;
    border-bottom:4px solid white;
    padding:18px;
    margin-bottom:25px;
    color:white;
    font-size:16px;

}


input::placeholder,
textarea::placeholder{

    color:#aaa;

}



textarea{

    height:170px;
    resize:none;

}



button{

    width:100%;
    padding:18px;
    background:transparent;
    border:1px solid white;
    color:white;
    font-weight:bold;
    letter-spacing:2px;
    cursor:pointer;

}


button:hover{

    background:white;
    color:black;

}


@media(max-width:900px){

nav ul{

    display:none;

}


.contact h1{

    font-size:40px;

}

}

</style>

</head>


<body>



<nav>


<div class="logo">
PSYCHOVERSE
</div>



<ul>

<li>
<a href="index.html">
HOME
</a>
</li>


<li>
<a href="index.html#games">
GAMES
</a>
</li>


<li>
<a href="index.html#about">
ABOUT
</a>
</li>


<li>
<a href="contact.html">
CONTACT
</a>
</li>

</ul>


</nav>





<section class="contact">


<h1>
CONTACT US
</h1>


<p>
Contact us, be clear and objective. We will respond as soon as possible.
</p>



<form action="https://formspree.io/f/xvkodrob" method="POST">


<input type="hidden" name="_next" value="https://psychoyt2002.github.io/thank-you.html">


<input 
type="text"
name="name"
placeholder="Name*"
required>


<input
type="email"
name="email"
placeholder="Email*"
required>


<input
type="text"
name="subject"
placeholder="Subject*"
required>


<textarea
name="message"
placeholder="Message*"
required></textarea>



<button type="submit">
SEND
</button>



</form>


</section>



</body>

</html>
