<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | PsychoVerse</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    background:#111;
    color:white;
    font-family:Arial, Helvetica, sans-serif;

}


.contact{

    min-height:100vh;

    padding:100px 12%;

}


h1{

    text-align:center;

    font-size:55px;

    margin-bottom:40px;

}


p{

    text-align:center;

    color:#aaa;

    font-size:20px;

    margin-bottom:40px;

}



form{

    max-width:800px;

    margin:auto;

}



input,
textarea{

    width:100%;

    background:#222;

    border:none;

    border-bottom:4px solid white;

    padding:20px;

    margin-bottom:25px;

    color:white;

    font-size:16px;

}



textarea{

    height:170px;

    resize:none;

}



button{

    width:100%;

    padding:18px;

    background:transparent;

    color:white;

    border:1px solid white;

    font-weight:bold;

    font-size:16px;

    cursor:pointer;

}


button:hover{

    background:white;

    color:black;

}


</style>


</head>


<body>


<section class="contact">


<h1>
CONTACT US
</h1>


<p>
Contact us, be clear and objective. We will respond as soon as possible.
</p>



<form action="https://formspree.io/f/xvkodrob" method="POST">


<input 
type="text" 
name="name" 
placeholder="Name*"
required>


<input 
type="email" 
name="email" 
placeholder="Email*"
required>


<input 
type="text" 
name="subject" 
placeholder="Subject*"
required>


<textarea 
name="message" 
placeholder="Message*"
required></textarea>



<button type="submit">

SEND

</button>


</form>



</section>



</body>

</html>
