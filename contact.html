<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | PsychoVerse</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

nav{
    height:90px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 7%;
    border-bottom:1px solid #222;
    background:#080808;
}

.logo{
    font-size:25px;
    font-weight:800;
    letter-spacing:5px;
}

nav ul{
    display:flex;
    gap:40px;
    list-style:none;
}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:15px;
    letter-spacing:1px;
    transition:.3s;
}

nav a:hover{
    color:white;
}

.contact-wrapper{
    width:70%;
    max-width:1000px;
    margin:70px auto 100px;
}

.contact-wrapper h1{
    text-align:center;
    font-size:52px;
    margin-bottom:45px;
    letter-spacing:2px;
}

.contact-wrapper .intro{
    font-size:22px;
    color:#ddd;
    margin-bottom:30px;
}

.contact-form{
    display:flex;
    flex-direction:column;
    gap:24px;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    background:#222;
    border:none;
    border-bottom:4px solid white;
    color:white;
    padding:18px 15px;
    font-size:17px;
    outline:none;
}

.contact-form textarea{
    height:180px;
    resize:vertical;
}

.contact-form input::placeholder,
.contact-form textarea::placeholder{
    color:#ddd;
}

.contact-form button{
    margin-top:5px;
    width:100%;
    padding:18px;
    background:transparent;
    color:white;
    border:1px solid white;
    font-size:17px;
    font-weight:bold;
    letter-spacing:2px;
    cursor:pointer;
    transition:.25s;
}

.contact-form button:hover{
    background:white;
    color:black;
}

footer{
    padding:40px 7%;
    border-top:1px solid #222;
    color:#666;
    display:flex;
    justify-content:space-between;
}

@media(max-width:800px){

    nav ul{
        display:none;
    }

    .contact-wrapper{
        width:88%;
    }

    .contact-wrapper h1{
        font-size:38px;
    }

    .contact-wrapper .intro{
        font-size:18px;
    }

    footer{
        flex-direction:column;
        gap:15px;
    }
}

</style>

</head>

<body>

<nav>

<div class="logo">
PSYCHOVERSE
</div>

<ul>
<li><a href="index.html">HOME</a></li>
<li><a href="index.html#games">GAMES</a></li>
<li><a href="index.html#about">ABOUT</a></li>
<li><a href="contact.html">CONTACT</a></li>
</ul>

</nav>


<div class="contact-wrapper">

<h1>CONTACT US</h1>

<p class="intro">
Contact us, be clear and objective. We will respond as soon as possible.
</p>

<form class="contact-form">

<input type="text" placeholder="Name*" required>

<input type="email" placeholder="Email*" required>

<input type="text" placeholder="Subject*" required>

<textarea placeholder="Message*" required></textarea>

<button type="submit">
— SEND —
</button>

</form>

</div>


<footer>

<div>
PSYCHOVERSE
</div>

<div>
© 2026 PsychoVerse. All rights reserved.
</div>

</footer>

</body>

</html>
