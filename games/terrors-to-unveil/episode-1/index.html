<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Terrors to Unveil: Intrusion</title>

<style>

body {
    background:#080808;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}


.container {
    width:90%;
    margin:auto;
    padding-top:40px;
}


h1 {
    font-size:38px;
    margin-bottom:35px;
}


/* MAIN IMAGE AREA */

.gallery {
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:35px;
}


.main-image {

    width:850px;
    height:480px;
    object-fit:cover;

}


/* ARROWS */

.arrow {

    width:55px;
    height:55px;

    border-radius:50%;

    background:#222;

    border:1px solid #aaa;

    color:white;

    font-size:35px;

    cursor:pointer;

}



/* THUMBNAILS */

.thumbnails {

    display:flex;

    gap:12px;

    margin-top:25px;

    width:850px;

    overflow-x:auto;

}


.thumbnails img {

    width:120px;

    height:70px;

    object-fit:cover;

    cursor:pointer;

    opacity:0.65;

    border:2px solid transparent;

}


.thumbnails img:hover,
.thumbnails img.active {

    opacity:1;

    border:2px solid white;

}



/* TEXT */

.description {

    width:850px;

    margin-top:35px;

}


.description p {

    font-size:18px;

    line-height:1.6;

    color:#ddd;

}


h2 {

    font-size:26px;

    margin-top:35px;

}



/* BUTTON */

button {

    margin-top:30px;

    padding:16px 35px;

    background:white;

    color:black;

    border:none;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}

</html>
